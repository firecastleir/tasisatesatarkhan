name: daily-content
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and Persian font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-vazirmatn fontconfig
          fc-cache -f
      - run: pip install requests edge-tts
      - name: Generate and publish
        env:
          WP_SITE: https://tasisatesatarkhan.ir
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_TTS_VOICE: Kore
          POST_STATUS: draft
        run: python main.py
      - name: Backup videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
