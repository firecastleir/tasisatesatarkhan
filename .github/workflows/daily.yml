name: daily-content
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and Persian font
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-vazirmatn fontconfig
          fc-cache -f
      - run: pip install requests edge-tts
      - name: Generate and publish
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          WP_SITE: https://tasisatesatarkhan.ir
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_TTS_VOICE: Kore
          POST_STATUS: draft
        run: python -u run.py
      - name: Backup videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
